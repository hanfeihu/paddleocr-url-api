name: build-macos-pkg

# macOS pkg 依赖 offline/payload（含 Python 运行时和 wheels），
# 该目录在 .gitignore 中，因此 CI 无法自动构建。
# 请在本地执行 bash installer/build_pkg.sh 后，
# 使用 gh release upload <tag> dist/paddleocr-url-api-*.pkg 上传。

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build pkg
        shell: bash
        run: |
          bash installer/build_pkg.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: paddleocr-url-api-macos-pkg
          path: dist/paddleocr-url-api-*.pkg
